name: shorts

on:
  push:
    branches: [main]
    paths:
      - "jobs/shorts/**"
      - "render/shorts.py"
      - ".github/workflows/shorts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
      - name: Generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render/shorts.py
      - name: Save status
        if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Shorts-Status [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          exit 1

