name: nuh_fix
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q faster-whisper==1.1.1 av==12.3.0 requests
      - run: python3 tools/nuh_verify_cut.py 2>&1 | tee /tmp/l.txt; mkdir -p out/nuh_fix; tail -c 3000 /tmp/l.txt > out/nuh_fix/log.txt
      - if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/nuh_fix || true
          git diff --cached --quiet && exit 0
          git commit -m "Nuh Schnitttest [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 6; done
