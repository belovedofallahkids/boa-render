name: render

on:
  push:
    branches: [main]
    paths:
      - "jobs/**"
      - "render/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      force_job:
        description: "Job name to render again even if unchanged"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -version | head -1

      - name: Check sheets
        continue-on-error: true
        run: python3 render/sheets.py

      - name: Transcribe jobs
        continue-on-error: true
        run: python3 render/transcribe.py 2>&1 | tee transcribe.log; mkdir -p out/transcripts; tail -c 6000 transcribe.log > out/transcripts/last_run.log

      - name: Render jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JOB: ${{ github.event.inputs.force_job }}
        run: python3 render/render.py

      - name: Save status
        if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render-Status [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          exit 1
