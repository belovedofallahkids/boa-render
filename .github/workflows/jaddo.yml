name: jaddo

on:
  push:
    branches: [main]
    paths:
      - "tools/jaddo01_build.py"
      - "jobs/jaddo/**"
      - ".github/workflows/jaddo.yml"
  workflow_dispatch:
    inputs:
      name: {description: "output name", required: false, default: "jaddo01_ar_v2"}

permissions:
  contents: write

concurrency:
  group: jaddo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q faster-whisper opencv-python-headless pillow
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers
      - name: Sources (store permanently in release jaddo01_src, H40)
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          set -e
          mkdir -p src
          gh release view jaddo01_src >/dev/null 2>&1 || gh release create jaddo01_src -t jaddo01_src -n "اسأل جدّو – الحلقة 1: الأصوات والصور الأصلية (ElevenLabs)"
          gh release download jaddo01_src -D src --skip-existing || true
          python3 -c "import json;[print(k,v) for k,v in json.load(open('jobs/jaddo/jaddo01_src.json'))['files'].items()]" | while read n u; do
            case "$n" in img_*) f="src/$n.png";; *) f="src/$n.mp3";; esac
            if [ -s "$f" ]; then echo "have $n"; continue; fi
            curl -fsSL "$u" -o "$f" && gh release upload jaddo01_src "$f" --clobber && echo "stored $n"
          done
          ls -la src
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JADDO_NAME: ${{ github.event.inputs.name || 'jaddo01_ar_v2' }}
        run: python3 tools/jaddo01_build.py
      - name: Save report
        if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out || true
          git diff --cached --quiet && exit 0
          git commit -m "jaddo01 render status [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 6; done
