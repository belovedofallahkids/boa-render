name: subs

on:
  push:
    branches: [main]
    paths:
      - "subs/*_de.srt"
      - "scripts/**"
      - "render/review.py"
      - "render/translate.py"
      - ".github/workflows/subs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subs
  cancel-in-progress: false

jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Translate
        run: python3 render/translate.py
      - name: Review scripts
        continue-on-error: true
        run: python3 render/review.py
      - name: Save
        if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs out/subs reviews || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Untertitel [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          exit 1
