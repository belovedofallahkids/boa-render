name: dub_free

on:
  # no push trigger (30.10.2026): a push re-dubbed Yaqub v1 by default; run only by dispatch
  workflow_dispatch:
    inputs:
      ep:
        description: "episode key (e.g. folge10_yaqub)"
        default: "folge10_yaqub"
      fill:
        description: "1 = add owner-approved gap lines (dub/<ep>_fill_v1.json)"
        default: "0"
      dur:
        description: "published video length in seconds (empty = from job)"
        default: ""
      ver:
        description: "track version tag (empty = v1, or v2 with fill)"
        default: ""
      rates:
        description: "optional JSON rate override per language, e.g. {\"tr\": \"+0%\"}"
        default: ""
      job:
        description: "job file (empty = newest jobs/<ep>_vN.json), e.g. jobs/folge14_musa_v3_keyed.json"
        default: ""

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP: ${{ github.event.inputs.ep || 'folge10_yaqub' }}
        run: |
          gh release view "dub_${EP}_free" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "dub_${EP}_free" --repo "$GITHUB_REPOSITORY" --title "dub_${EP}_free" \
            --notes "Kostenlose Dub-Spuren (edge-tts), ENTWURF – Besitzer hört vor dem Upload (H46.6, H54)"
  dub:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en, tr, bs, sq]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts faster-whisper
      - name: Dub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUB_LANG: ${{ matrix.lang }}
          DUB_EP: ${{ github.event.inputs.ep || 'folge10_yaqub' }}
          DUB_FILL: ${{ github.event.inputs.fill || '0' }}
          DUB_DURATION: ${{ github.event.inputs.dur || '' }}
          DUB_VER: ${{ github.event.inputs.ver || '' }}
          DUB_JOB: ${{ github.event.inputs.job || '' }}
          DUB_RATES: ${{ github.event.inputs.rates || '' }}
        run: python3 tools/dub_free.py
