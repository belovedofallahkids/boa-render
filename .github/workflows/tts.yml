name: tts

on:
  push:
    branches: [main]
    paths:
      - "jobs/tts/**"
      - "render/tts.py"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts edge-tts faster-whisper
      - name: Generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render/tts.py
      - name: Save status
        if: always()
        run: |
          git config user.name "boa-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TTS-Status [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          exit 1
