name: verses
on:
  workflow_dispatch:
    inputs:
      episode: {required: true}
      keys: {required: true}
permissions: {contents: write}
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_verses.py "${{ inputs.episode }}" "${{ inputs.keys }}" 2>&1 | tee /tmp/l.txt; mkdir -p dub/verses; tail -c 3000 /tmp/l.txt > dub/verses/${{ inputs.episode }}.log
      - run: |
          git config user.name "boa-render-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dub/verses; git diff --cached --quiet && exit 0
          git commit -m "verses ${{ inputs.episode }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 6; done
